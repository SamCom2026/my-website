<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8e8ec;
      --muted: #9a9caa;
      --accent: #6c8cff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
        "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.7;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);

      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 180px;
      margin: 0 auto 24px;
      padding: 16px 22px;
      border-radius: 16px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: var(--accent);
    }

    .avatar img {
      width: 100%;
      height: auto;
      display: block;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .title {
      color: var(--accent);
      font-size: 15px;
      font-weight: 500;
      margin-top: 6px;
    }

    .bio {
      color: var(--muted);
      font-size: 15px;
      margin-top: 20px;
    }

    .socials {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .social-link:hover {
      background: rgba(108, 140, 255, 0.15);
      transform: translateY(-2px);
    }

    /* スタッガー（順番に出てくる）アニメーション */
    .card > * {
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
    }
    .avatar  { animation-delay: 0.25s; }
    .name    { animation-delay: 0.35s; }
    .title   { animation-delay: 0.45s; }
    .bio     { animation-delay: 0.55s; }
    .socials { animation-delay: 0.65s; }

    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }
      .name {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- ロゴ: index.html と同じフォルダに logo.png を置く。別名にする場合は src を変更 -->
    <div class="avatar" id="avatar">
      <img src="logo.png" alt="株式会社SamCom ロゴ" id="logo">
    </div>

    <!-- ↓ ここを自分の名前に変える -->
    <h1 class="name" id="name">株式会社SamCom</h1>

    <!-- ↓ ここを自分の肩書きに変える -->
    <p class="title">採用特化型SNS運用中</p>

    <!-- ↓ ここを自分の紹介文に変える -->
    <p class="bio">
      人手不足０を目指す。みんなが納得して幸せに働ける職場を実現する仕事をしてます。
    </p>

    <div class="socials">
      <!-- ↓ 自分の X アカウントの URL に変える -->
      <a class="social-link" href="https://x.com/自分のアカウント" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        X
      </a>
    </div>
  </main>

  <script>
    // logo.png が見つからない場合は、名前の先頭1文字を表示するフォールバック
    (function () {
      var logo = document.getElementById('logo');
      logo.addEventListener('error', function () {
        var avatar = document.getElementById('avatar');
        var name = document.getElementById('name').textContent.trim();
        avatar.textContent = name ? name.charAt(0) : '?';
      });
    })();
  </script>
</body>
</html>
